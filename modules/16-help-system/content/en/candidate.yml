# AssessIQ help content — candidate audience, en locale.
# Edit this file, then run:  pnpm tsx tools/generate-help-seed.ts
# to regenerate modules/16-help-system/seeds/help_content.sql.

# ─── Pre-attempt intro ───

candidate.intro.integrity:
  audience: candidate
  version: 2
  short_text: "AssessIQ measures judgment and reasoning, not memory. Use any reference you would in a real workday."
  long_md: |
    ## Integrity expectations

    This assessment is not closed-book. AssessIQ is built to measure
    how you think on the job, not what you can recall under pressure. Use:

    - **Documentation** for the tools and languages you would normally
      reference at work.
    - **Search engines** to find syntax or operators.
    - **Notes** you would normally have open.

    Do **not** ask another person to answer for you, share screens, or paste
    answers from another candidate's attempt. AssessIQ records timing
    signals, edit patterns, and behavioral fingerprints; identical or
    near-identical answers across candidates are flagged for review.

    Once you click **Begin Assessment**, the timer starts and cannot be
    paused. If your network drops, your answers are saved every 5 seconds —
    you can refresh and continue.

# ─── Pre-assessment screen (system check, practice, consent) ───

candidate.intro.system_check:
  audience: candidate
  version: 2
  short_text: "A quick automatic check that your connection, browser and storage are ready. Fix any item marked Fix needed."
  long_md: |
    ## System check

    Before you begin, AssessIQ runs a few quick checks in your browser:

    - **Internet connection** and **connection to AssessIQ**: your answers save
      to our server as you work.
    - **Cookies and storage**: needed to keep you signed in and keep a local
      backup of your answers. Private or incognito windows often block them.
    - **Browser**: use the latest Chrome, Edge, Firefox or Safari.
    - **Screen size**: a very small screen only shows a notice.

    Nothing is sent about your device. If something needs fixing, follow the
    hint, then choose **Check again**. You can begin once every item is OK.

candidate.intro.practice:
  audience: candidate
  short_text: "One sample question so you can see how choosing an answer works. It is not saved and not scored."
  long_md: |
    ## Practice question

    This sample question uses the same answer options you will see in the assessment.
    Pick an option to try it. Nothing you choose here is saved, scored or
    shared. The timer has not started yet.

candidate.intro.consent:
  audience: candidate
  version: 2
  short_text: "Confirm it is you, taking the assessment alone, and agree to the Terms and Privacy Policy before you begin."
  long_md: |
    ## Consent and AI-use notice

    Before the timer starts, confirm that you are the person invited. Confirm that
    you will take the assessment on your own. Agree to the Terms and Privacy Policy.
    Your results may be shared with the organisation that invited you. We record
    when you agreed.

    **How answers are scored:** AssessIQ scores multiple-choice answers
    automatically. AssessIQ graders grade written answers, if any, with AI
    assistance. The organisation that invited you then releases the results.

# ─── During the attempt ───

candidate.attempt.timer:
  audience: candidate
  version: 2
  short_text: "Time left for the whole assessment. It submits at zero. You cannot pause the timer."
  long_md: |
    ## Timer

    The countdown shows the time left for the entire assessment, not the
    current question. When it reaches zero, AssessIQ submits the answers
    you have entered.

    **The timer keeps running even if you close the tab.** Network dropouts
    do not pause it. If you cannot continue (for example a power outage or a
    medical emergency), close the tab and contact your administrator
    at once. Your administrator can grant a one-time extension before you submit.

    Behavioral signals recorded by AssessIQ include time spent per question,
    number of edits, and navigation pattern. None of these signals affect
    your score directly; they inform the admin's review.

candidate.attempt.flag:
  audience: candidate
  version: 3
  short_text: "Mark a question to review before you submit. A flag does not change your score."
  long_md: |
    ## Flag for review

    Use this when you want to come back to a question before you submit. For instance, flag a question if you are not sure of your answer or want to verify a query.

    Flagged questions appear with a star in the navigation panel. You can flag
    multiple questions; the **Review** screen lists all flagged + unanswered
    items together so you do not miss anything.

    Flagging does not change your score. It is a personal bookmark.

candidate.attempt.question_timer:
  audience: candidate
  short_text: "This question has its own time limit. At zero, you cannot change the answer."
  long_md: |
    ## Question timer

    Some sections give each question a fixed time. The countdown starts when you open the question.

    When the time is up, the answer box closes. Your last saved answer stays as it is.

    The countdown does not move you to the next question. You must choose the next question yourself.

candidate.attempt.question_time_up:
  audience: candidate
  short_text: "The time for this question has ended. Your last saved answer stays."
  long_md: |
    ## Time is up for this question

    The time for this question has ended. You cannot change the answer to it.

    Your last saved answer stays and is scored. You can still open other questions in this section, if the section allows it.

candidate.attempt.section_leave:
  audience: candidate
  short_text: "This section is locked. Once you leave it, you cannot come back to it."
  long_md: |
    ## Leaving a locked section

    Some sections are locked. When you leave one, it closes for good.

    Choose Stay to keep working in this section. Choose Leave to move on. You cannot return after you leave.

candidate.attempt.kql.editor:
  audience: candidate
  short_text: "Type your KQL query in this box. It is saved as you work and scored later by an AssessIQ grader."
  long_md: |
    ## KQL answer box

    This is a plain text box. Type or paste your KQL query. There is no syntax
    highlighting, autocomplete or automatic check in this box.

    - Your query is saved as you work.
    - Your query is not run against real data.
    - Your query is not scored automatically. An AssessIQ grader reads and
      scores it.

candidate.shell.nav.mobile_menu:
  audience: candidate
  short_text: "Open the navigation menu. Jump to Certificates, Activity, or sign out."
  long_md: |
    ## Candidate navigation menu

    On a phone the top bar is too narrow to show the Certificates / Activity
    links inline. Tap the small handle icon on the right of the top bar to
    open a dropdown menu containing:

    - **Certificates** — your earned certificates.
    - **Activity** — your assessment history and rankings.
    - **Sign out** — end your session.

    The menu closes automatically when you pick an item, when you tap
    outside it, or when you press Escape. On a laptop these links appear
    inline in the top bar and the handle button is hidden.

candidate.attempt.kql.mobile_tip:
  audience: candidate
  version: 3
  short_text: "KQL is easier on a desktop browser. Use a desktop for long queries."
  long_md: |
    ## Why KQL is shown with a desktop tip on phones

    The KQL question type expects you to write a structured query. Mobile keyboards lack the punctuation, operators, and pipe character that KQL uses frequently. The small viewport also makes it hard to see your full query while you write it.

    You can still answer here — the textarea works the same on phone and
    desktop, and your autosave runs identically. But if the question is syntax-heavy (multiple pipes, complex joins, regex), open the link on a laptop. It is much faster to answer from there.

    This tip only appears on phones. On desktop you see the same editor
    without the notice.

candidate.attempt.scenario.steps:
  audience: candidate
  short_text: "Multi-step incident. Some steps may unlock only after submitting earlier steps."
  long_md: |
    ## Scenario steps

    Scenario questions describe a developing incident across multiple steps.
    Each step asks for a decision or analysis given the evidence so far.

    **Two modes:**

    - **Free navigation** (default): jump between steps freely. You may
      revise earlier steps as later evidence arrives.
    - **Locked progression**: each step unlocks only after you submit the
      previous one. Look for a small lock icon on later steps.

    Once you submit a step in locked mode, you cannot edit it. In free mode
    every step stays editable until you submit the assessment.

    Behavioral note: AssessIQ records the order you visited the steps. There
    is no "correct" order — exploring later evidence first is a valid
    strategy.

candidate.attempt.structured_case:
  audience: candidate
  short_text: "Read the case, then answer each step. Choose one answer or tick all that apply."
  long_md: |
    ## Structured case

    Read the story and the log first. Then answer each step in order.

    - A round button means choose **one** answer.
    - A square box means tick **all** answers that apply.
    - You can change your answers until you submit the assessment.
    - A step you leave blank scores 0.

candidate.attempt.subjective.length:
  audience: candidate
  short_text: "Recommended 80–200 words per answer. Quality of reasoning beats word count."
  long_md: |
    ## Subjective answer length

    Subjective questions are graded on the rubric (key points and score bands), not on
    length. A 60-word answer that nails the tradeoff scores higher than a
    300-word answer that meanders.

    **Rough guide:**

    - **Below 40 words:** rarely enough to demonstrate reasoning.
    - **80–200 words:** the sweet spot for most rubrics.
    - **Above 300 words:** law of diminishing returns; you are using time
      that other questions need.

    Markdown formatting (bullets, **bold**, `code`) renders in the grader's
    review. Use it when it clarifies; do not use it as filler.

candidate.attempt.disconnect:
  audience: candidate
  version: 2
  short_text: "AssessIQ saves your answers every 5 seconds. Refresh the page and continue. The timer keeps running."
  long_md: |
    ## If your connection drops

    AssessIQ saves your in-progress answers to the server every 5 seconds and
    shows a small green check next to "Saved" when the latest save completed.
    A red dot means the last save attempt failed; AssessIQ will retry on the
    next interval.

    **If you lose connectivity:**

    1. **The timer keeps running** — wall-clock time, not connected time.
    2. **Reconnect and refresh** — your most recent autosaved state loads.
    3. **Anything typed during the offline window is lost** — only saved
       state survives a refresh.

    For a genuinely-blocking outage (power, hardware failure), close the tab
    and contact your administrator. They can grant a one-time extension
    before you submit, but cannot extend after auto-submit fires.

candidate.attempt.navigator.toggle:
  audience: candidate
  version: 2
  short_text: "Open the question navigator. Jump to any question, see which are answered, flagged, or unseen."
  long_md: |
    ## Question navigator

    On a phone, the question navigator is hidden behind a small grid button
    in the top bar. Tap it to open a bottom-sheet panel that shows every
    question in the assessment as a numbered cell.

    Cell colours mean:

    - **Filled accent** — the question you are on right now.
    - **Soft green** — you have entered an answer.
    - **Soft amber outline** — you have flagged the question to revisit.
    - **Plain outline** — you have not yet visited the question.

    Tap any cell to jump straight to that question. The bottom-sheet
    closes automatically after you pick. Your in-progress answer on the
    current question is saved before the jump — you will not lose typing.

    On a laptop the navigator is always visible on the right side of the
    page and this button is hidden.

candidate.attempt.submit.confirm:
  audience: candidate
  short_text: "Once submitted, you cannot reopen the attempt. Verify your flagged questions first."
  long_md: |
    ## Submitting your attempt

    Once you submit, your attempt is **final**. AssessIQ does not allow editing answers after
    submit, and there is no second attempt unless your administrator
    explicitly grants one.

    Before clicking the final **Submit** button, the **Review** screen shows:

    - Flagged questions you wanted to revisit.
    - Unanswered questions (a blank textarea or empty MCQ counts).
    - Questions whose autosave is stale (rare — usually only seconds old).

    Walk through any starred or unanswered items. When you are ready, click
    **Submit**. AssessIQ asks you to confirm the submit in a final dialog and the
    candidate timer freezes immediately.

# ─── Final-submit dialog & results ───

candidate.submit.confirm:
  audience: candidate
  short_text: "Your answers are saved. You will see your result on this page or by email once it is final."
  long_md: |
    ## After you submit

    Your answers are saved. You will see your result on this page or by email once it is final. The timer has stopped.
    There is nothing more you need to do.

    - **Instant scoring.** If every question is multiple choice and your
      organisation releases results automatically, your result appears on
      this page in under a minute.
    - **Otherwise** your result is emailed to your registered address, shown
      here with part of it hidden (for example `r***@gmail.com`). The message
      on this page says how long that usually takes.
    - You only ever see a **complete, final** result — never a partial score
      while grading is still in progress.

    If the email does not arrive, check your spam folder. You can also sign
    in to the candidate portal with the same email address to see your
    results.

# Key name kept (renaming a help_id breaks tenant overrides); the content is
# now about the result card, not bands — the band model is no longer shown to
# candidates (owner rule P1, 2026-10-01).
candidate.result.bands:
  audience: candidate
  short_text: "Your result shows your score, the percentage and whether you passed. You only ever see a complete, final result."
  long_md: |
    ## Understanding your result

    A released result shows four things:

    - **Score** — the points you earned out of the total available, for
      example 42 / 60.
    - **Percent** — your score as a percentage of the total.
    - **Passed or Not passed** — your percentage compared with the pass mark
      set for this assessment.
    - **Certificate** — if you earned one, a link to view and verify it.

    A result is released only when grading is finished and final. You will
    never see a partial or provisional score. Answer keys and per-question
    marks are not shown.

candidate.results.list:
  audience: candidate
  version: 2
  short_text: "Every result your organisation has released to you, newest first, with a link to any certificate you earned."
  long_md: |
    ## My results

    This page lists the results your organisation has **released** to you,
    newest first. Each one shows your score, the percentage, whether you
    passed, and a link to your certificate when you earned one.

    - A result appears here only when grading is finished and it has been
      released — never earlier, and never as a partial score.
    - When a result is released we also email you, with a link back to this
      page.
    - If an assessment you took is missing, its result is not released yet.

# ─── Certificates ───

candidate.cert.share_linkedin:
  audience: candidate
  short_text: "Click Share on LinkedIn to post your certificate. Each share is counted in My Certificates."
  long_md: |
    ## Share Your Certificate on LinkedIn

    When you earn a certificate, click **Share on LinkedIn** to post it to your
    LinkedIn profile. A counter records each share so you can track your
    engagement in My Certificates.

candidate.cert.completion_modal:
  audience: candidate
  short_text: "A congratulations pop-up appears once per certificate tier the first time you view each earned certificate."
  long_md: |
    ## Completion Celebration

    After a graded result is released, My Certificates may show a congratulations
    pop-up the first time you view each certificate. The pop-up appears once per
    certificate tier; if you earn a higher tier later, it will appear again.

public.verify.share_linkedin:
  audience: all
  short_text: "Share this verified credential to your LinkedIn network in one click."
  long_md: |
    ## Share on LinkedIn

    Opens LinkedIn's share dialog with this certificate's public verification
    link pre-filled. LinkedIn fetches the page and displays a rich preview card
    showing your name and course title.

    Only **active** (non-revoked) certificates can be shared. If this
    certificate has been revoked, the button is disabled.

candidate.profile.name_callout:
  audience: candidate
  short_text: "Certificate names are taken from your profile at issuance. Update your profile name before completing an assessment."
  long_md: |
    ## Your Name on Certificates

    The name printed on your certificates is taken from your profile at the time
    of issuance. To make sure your certificates show the correct name, keep your
    profile name up to date before completing an assessment.

# ─── Sign-in (magic-link) ───

candidate.auth.request_link:
  audience: candidate
  short_text: "Enter the email address your administrator used to register you. We will email you a sign-in link — no password needed."
  long_md: |
    ## Sign in with a magic link

    Type the email address your administrator registered you with and click
    **Send link**. AssessIQ will email you a one-time sign-in link that is
    valid for 15 minutes.

    You do not need a password. Clicking the link in your email is all it
    takes to sign in and view your certificates.

    **Already signed in?** If you already have an active session you will be
    taken straight to your certificates without needing to request a new link.

candidate.auth.org_code:
  audience: candidate
  version: 2
  short_text: "Your organisation's short code, for example acme-college. If you do not have it, ask your administrator."
  long_md: |
    ## Organisation code

    The code identifies the organisation (a school, college or business) that
    registered you, so AssessIQ can find your account. It is made of lowercase
    letters, digits and hyphens, for example `acme-college`.

    - If you opened this page from a link in an email from us, the code is
      already included and this box is not shown.
    - Otherwise, ask your administrator for the code.

candidate.auth.link_sent:
  audience: candidate
  version: 2
  short_text: "A sign-in link is on its way. It expires in 15 minutes. If it does not arrive, wait one minute and try again."
  long_md: |
    ## Check your email

    A sign-in link has been sent to the address you entered. It will arrive
    within a minute or two depending on your email provider.

    **The link expires in 15 minutes.** If you do not click it in time, come
    back to the sign-in page and request a new one.

    **Did not receive anything?**

    - Check your spam or junk folder.
    - Make sure you entered the exact email address your administrator
      registered you with.
    - Wait at least 60 seconds before requesting another link (too many
      requests in a short window are automatically rate-limited).

    Each link is single-use — clicking it a second time will not work.
    Request a fresh link if you need to sign in again.

candidate.auth.session_status:
  audience: candidate
  version: 2
  short_text: "You are currently signed in. Your session lasts 30 days from when you first clicked your sign-in link."
  long_md: |
    ## Your sign-in session

    You are signed in and your session is active. AssessIQ candidate sessions last **30 days** from the moment you clicked your sign-in link. You do not need to sign in again during that period.

    The session is tied to this browser. If you switch to a different browser
    or device you will need to request a new sign-in link.

    **To sign out early**, close your browser or clear cookies. Your
    certificates remain available; you just need a fresh link next time.

candidate.auth.expiring_soon:
  audience: candidate
  short_text: "Your session expires in the next 5 days. Request a new sign-in link now to avoid being logged out unexpectedly."
  long_md: |
    ## Your session is expiring soon

    Your 30-day sign-in session will expire within the next 5 days. After it
    expires you will be signed out automatically and will need to request a
    new link to view your certificates again.

    **To renew:** visit the sign-in page, enter your email address, and click
    the link in the email you receive. Your certificates and history are not
    affected — only the session changes.

candidate.activity:
  audience: candidate
  version: 3
  short_text: "Personal activity dashboard: completions, average score, 52-week heatmap, weekly chart and question set rankings."
  long_md: |
    ## My activity

    This page gives you a full picture of your assessment history on this
    organisation.

    ### Stat cards

    - **Assessments completed** — total submitted attempts in the selected period,
      broken down by subject.
    - **Question sets attempted** — distinct question sets you have ever submitted
      an attempt for.
    - **Avg. score** — your mean auto-graded score across all completed
      attempts in the period, with a quartile breakdown.

    Use the **This week / This month / This quarter** toggle to adjust the
    stats window. The heatmap and weekly chart always show the full 52-week
    rolling window regardless of the toggle.

    ### Activity streak

    The 52-week heatmap shows one cell per day. Darker cells mean more
    completions on that day. The current streak counts consecutive days with
    at least one submitted attempt up to and including today.

    ### Weekly completions

    The stacked bar chart shows how many assessments you submitted each week,
    coloured by subject. Hover a bar to see the exact breakdown.

    ### My question set rankings

    One row per question set you have attempted. Shows your **best score** (the highest auto-graded result across all your attempts). It also shows your **rank** among every candidate in this organisation who took the same question set. For example
    "#3 of 24" means your best score places you third out of the 24 candidates
    who have submitted that question set.

    Ranks are computed live and update as other candidates submit new attempts.

candidate.attempt.section:
  audience: candidate
  short_text: "This assessment has timed sections. You cannot return to a section once it is finished."
  long_md: |
    ## Assessment sections

    The assessment is split into sections. The timer at the top is for the **current
    section** only.

    - When the section timer reaches zero, your answers in that section are saved
      and locked, and the next section opens.
    - Press **Finish section** to move on early. You will be asked to confirm,
      because **you cannot come back** to that section.
    - The assessment ends when the last section ends, or when you submit in the last section.

candidate.attempt.calculator:
  audience: candidate
  short_text: "A basic calculator for this section: add, subtract, multiply, divide."
  long_md: |
    ## Calculator

    Use the on-screen buttons or your keyboard: digits and **.** to type, **+ - * /**
    for the operations, **Enter** or **=** for the result, **Backspace** to delete
    and **Esc** to clear.

    It is a basic calculator with no memory. Your answer still has to be typed into
    the question yourself.

candidate.attempt.submit_sections:
  audience: candidate
  short_text: "Before you submit, check how many questions are unanswered in every section."
  long_md: |
    ## Submitting a sectioned assessment

    The confirmation lists every section with its unanswered questions.

    - Sections marked **closed** are finished. You cannot change their answers.
    - Only the current section can still be edited before you submit.
    - Submitting ends the assessment.

candidate.shell.new_results_notice:
  audience: candidate
  short_text: "You have new published results. Open Results to see them."
  long_md: |
    ## New results

    This banner shows when your organisation publishes a new result for you. It shows the count of results that you have not seen yet. Select **View results** to open the list. The banner goes away after you open the Results page.

# ---- S14 (2026-10-16): P0-Z batch 3 ----

candidate.result.negative_marking:
  audience: candidate
  short_text: "This assessment takes marks away for wrong answers. The line shows the total that was deducted."
  long_md: |
    ## Negative marking

    - A wrong answer on an auto-scored question takes marks away. A question you left blank takes nothing away.
    - The score shown is your total after the deduction. It can be below zero.
    - Your band and any certificate use zero as the lowest score.

candidate.take.landing.logo:
  audience: candidate
  short_text: "The organisation that invited you. AssessIQ runs the assessment on its behalf."
  long_md: |
    ## Organisation

    This logo belongs to the organisation that invited you. AssessIQ provides the assessment platform. Your answers go to that organisation.

candidate.take.attempt.logo:
  audience: candidate
  short_text: "The organisation that set this assessment."
  long_md: |
    ## Organisation

    The logo in the top bar shows which organisation set this assessment. AssessIQ runs it on their behalf.

candidate.take.submitted.logo:
  audience: candidate
  short_text: "The organisation that will see your result."
  long_md: |
    ## Organisation

    Your submission went to this organisation. It decides when and how results are released.

candidate.shell.logo:
  audience: candidate
  short_text: "The organisation your results belong to."
  long_md: |
    ## Organisation

    This logo shows the organisation that invited you to the assessments listed here. AssessIQ runs the platform on their behalf.

candidate.take.structured_case.child_marks:
  audience: candidate
  short_text: "Marks for a right answer and marks taken away for a wrong one on this question."
  long_md: |
    ## Marks for this question

    The first number is what a right answer earns. The second number, with a minus sign, is what a wrong answer loses. A question you leave blank loses nothing.

candidate.progress:
  audience: candidate
  version: 1
  short_text: "Your released results over time: score trend, test history and strengths by subject."
  long_md: |
    ## Progress

    This page shows how you do across tests. It uses only results that your
    organisation has **released** to you.

    - Your score trend shows each test from the oldest to the newest.
    - Your test list shows the date, score and result of each test.
    - Your strengths show how well you answer questions in each subject.

    A result that is not released does not appear here.

candidate.progress.history:
  audience: candidate
  version: 1
  short_text: "Each released test with its date, score, result and a certificate link."
  long_md: |
    ## Your tests

    Each row is one released test. It shows the date, your score, and whether
    you passed. If you earned a certificate, select **View** to open it.

candidate.progress.trend:
  audience: candidate
  version: 1
  short_text: "Your average and best score, and a line of your scores over time."
  long_md: |
    ## Score trend

    The line shows your score for each released test, from the oldest to the
    newest. You need at least two released tests to see the line.

candidate.progress.subjects:
  audience: candidate
  version: 1
  short_text: "How many questions you answered right in each subject."
  long_md: |
    ## Strengths by subject

    Each row shows one subject and the number of questions you answered right.

    - **Strong**: 75% or more right.
    - **Developing**: 50% to 74% right.
    - **Focus**: less than 50% right. Practise this subject first.

    Questions that have no subject are grouped under **Other**.


candidate.results.feedback:
  audience: candidate
  version: 1
  short_text: "Open this to see each question, your answer and whether it was right."
  long_md: |
    ## Review your answers

    Your organisation chooses what this section shows. It lists each question with your answer and the outcome. A "What to study" line shows the topic to practise.

candidate.results.feedback.expected:
  audience: candidate
  version: 1
  short_text: "The correct answer. It shows only for questions that are marked by rule."
  long_md: |
    ## Expected answer

    This is the correct answer. It shows for questions with one fixed answer, such as multiple choice. Written answers have no fixed answer.

candidate.results.feedback.explanation:
  audience: candidate
  version: 1
  short_text: "A short note about how your written answer was marked."
  long_md: |
    ## Why this mark

    This note says how strong your written answer was and gives a short reason. It is a summary, not the full marking.

candidate.results.feedback.study:
  audience: candidate
  version: 1
  short_text: "The topic to practise for this question."
  long_md: |
    ## What to study

    This line names the unit and subject of the question. If the question has no unit, it shows the topic.

candidate.result.retake:
  audience: candidate
  short_text: "Try again starts your next attempt. You see how many attempts you have."
  long_md: |
    ## Try again

    Some assessments allow more than one attempt. When you have an attempt left, you see
    "Try again" under a result that is not a pass.

    - **A new attempt is a new test.** The timer starts when you press the button.
    - **Your earlier result stays.** You can see it in your results list.
    - **No attempts left?** Ask your organisation if you need another attempt.
candidate.attempt.key_shortcuts:
  audience: candidate
  version: 1
  short_text: "Turn the P (Previous) and N (Next) keys on or off. Tick the box to use them."
  long_md: |
    ## Keyboard shortcuts P and N

    Two single keys move between questions. Press **P** for the previous question.
    Press **N** for the next question.

    - **The box is ticked by default.** The keys work when your cursor is not in a
      text box, a list or an editor.
    - **Clear the box to turn the keys off.** Then P and N do nothing. This stops
      accidental moves if you use speech input or press keys by mistake.
    - **Your choice stays on this browser.** It does not change your answers.

# ─── Mock test, readiness check, laptop-only message (Z-89, Z-91, Z-87) ───

candidate.intro.test_type_mock:
  audience: candidate
  short_text: "This is a mock test. It is practice: it gives no certificate and does not count as the real exam."
  long_md: |
    ## Mock test

    This is a practice run of the test. You can take it on any device.

    - **No certificate.** A mock test does not give a certificate.
    - **Labelled.** Your result shows a Mock label.
    - **Real exam later.** The real exam needs a laptop or desktop computer.

candidate.intro.readiness:
  audience: candidate
  short_text: "A quick check of your device, screen, browser and internet. Fix any item marked Fix needed, then select Retry."
  long_md: |
    ## Readiness check

    Before a real exam, AssessIQ checks that your device is ready.

    - **Laptop or desktop.** Phones and tablets cannot take a real exam.
    - **Screen size.** Use a screen of at least 1024 by 600 pixels.
    - **Browser.** Use a recent Chrome, Edge, Firefox or Safari.
    - **Internet speed.** A slow connection can lose your answers.

    Select **Retry** after you fix an item. You can begin when every item passes.
    For a mock test, this check is optional practice and never stops you.

candidate.intro.device_blocked:
  audience: candidate
  short_text: "Please open this link on a laptop or desktop computer to take this test."
  long_md: |
    ## Open this link on a laptop or desktop

    A real exam cannot start on a phone or tablet.

    - **Your invitation is safe.** It is not used up.
    - **What to do.** Open the same link on a laptop or desktop computer.

candidate.intro.camera_check:
  audience: candidate
  short_text: "Check that your camera works and the picture is clear before the test day."
  long_md: |
    ## Camera check

    A real exam with a camera needs a working camera.

    - **Allow the camera.** Your browser asks first. Choose Allow.
    - **Check the picture.** The small picture shows what the camera sees.
    - **Fix the angle and light.** Sit where your face is clear and lit from the front.
    - **Retry.** If the check fails, fix the problem and press Retry.

candidate.intro.camera_consent:
  audience: candidate
  short_text: "Your test uses your camera. Read what is recorded, then choose Allow or do not start."
  long_md: |
    ## Your camera and this test

    The consent screen says why the camera is used, what is recorded, who sees it and how long it is kept.

    - **Allow camera and start.** You agree to this use for this test only. The test starts.
    - **I do not agree.** The test does not start. Your invitation stays valid. Contact your test organiser.
    - **Your rights.** You can ask your test organiser to show or erase your files.

candidate.attempt.camera_indicator:
  audience: candidate
  short_text: "A small Camera on mark shows that your camera is working during the test."
  long_md: |
    ## Camera on

    The camera is on for this test. The mark shows while the camera works.

    - **Stay in view.** Keep your face in the picture.
    - **Do not cover the camera.** A covered camera can flag your test.

candidate.attempt.camera_lost:
  audience: candidate
  short_text: "Your camera stopped. Fix it, then press Retry. The event is flagged for your test organiser."
  long_md: |
    ## Camera stopped

    The camera stopped during your test. The test shows this message until the camera works again.

    - **Fix the camera.** Check that it is plugged in and allowed in your browser.
    - **Press Retry.** The test continues when the camera works.
    - **The event is flagged.** Your test organiser decides what happens next. AssessIQ does not fail you automatically.

candidate.attempt.report:
  audience: candidate
  short_text: "Tell us if this question looks wrong or unclear. Your test does not change."
  long_md: |
    ## Report a problem

    Press **Report a problem** if the question or its answer options look wrong, or if you cannot understand them.

    - Pick what is wrong and add a short note if you want.
    - Keep answering. Reporting does not stop your test and does not change your marks.
    - Your organiser and the AssessIQ team will check the question.
