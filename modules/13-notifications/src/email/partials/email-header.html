<!-- A3 email-header — organisation logo (or name) first. The AssessIQ wordmark lives in the footer only. Omitted when there is no org name. -->
{{#if org_name}}
<tr>
  <td style="padding:22px 36px;border-bottom:1px solid #e4e4e7;background:#ffffff">
    {{#if logo_url}}
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="vertical-align:middle">{{#if logo_w}}<img src="{{{logo_url}}}" alt="{{org_name}} logo" width="{{logo_w}}" height="{{logo_h}}" style="display:block;width:{{logo_w}}px;height:{{logo_h}}px;border:0">{{else}}<img src="{{{logo_url}}}" alt="{{org_name}} logo" width="120" height="48" style="display:block;width:auto;height:auto;max-width:120px;max-height:48px;object-fit:contain;border:0">{{/if}}</td>
      </tr>
    </table>
    {{else}}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:400;color:#0a0a0b;letter-spacing:-0.01em">{{org_name}}</td>
      </tr>
    </table>
    {{/if}}
  </td>
</tr>
{{/if}}
