<!-- A3 email-header — wordmark left, optional eyebrow right -->
<tr>
  <td style="padding:22px 36px;border-bottom:1px solid #e4e4e7;background:#ffffff">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:400;color:#0a0a0b;letter-spacing:-0.01em">
          {{_t_brand_wordmark}}
        </td>
        {{#if eyebrow}}
        <td align="right" style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;color:#71717a;text-transform:uppercase;letter-spacing:0.1em">
          {{eyebrow}}
        </td>
        {{/if}}
      </tr>
    </table>
    {{#if logo_url}}
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:14px">
      <tr>
        <td style="vertical-align:middle"><img src="{{{logo_url}}}" alt="{{logo_org_name}} logo" width="120" height="48" style="display:block;width:auto;height:auto;max-width:120px;max-height:48px;border:0"></td>
        <td style="vertical-align:middle;padding-left:10px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#71717a">via AssessIQ</td>
      </tr>
    </table>
    {{/if}}
  </td>
</tr>
