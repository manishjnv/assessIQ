# Vale config (RW-85). Rules live in docs/STYLE.md.
# Run: vale docs README.md   (install: https://vale.sh; then `vale sync`)
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = AssessIQ
Packages = Google
# Code is not prose: skip fenced code and HTML blocks, ignore inline code.
SkippedScopes = script, style, pre, figure
IgnoredScopes = code, tt, kbd

[*.md]
BasedOnStyles = Vale, Google, AssessIQ
# Z-48: these rules fight the project STE style or flag code and dates, so they are off.
Google.EmDash = NO
Google.Quotes = NO
Google.Units = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO
Google.Spacing = NO
Google.DateFormat = NO
Google.Slang = NO
# Capital letter at sentence start is correct English.
Vale.Terms = NO
# STE word list (via, etc). A warning until the docs are reworded (RW-100).
Vale.Avoid = warning

# Copy files that tools/lint-docs.mjs maps from help YAML and email templates.
# Help text quotes UI button labels ("hasn't started") that match the code and the seed SQL; the copy pass RW-87 owns them.
[*help-*.yml.md]
AssessIQ.Contractions = warning
# {{placeholder}} becomes X, so two placeholders in a row look like a repeated word.
[*email-*.txt.md]
Vale.Repetition = NO

# Not checked: history and tool folders.
[docs/plans/archive/**]
BasedOnStyles =
[docs/SESSION_STATE.md]
BasedOnStyles =
[docs/RCA_LOG.md]
BasedOnStyles =
[.claude/**]
BasedOnStyles =
[node_modules/**]
BasedOnStyles =

# Out of scope for the docs style: vendor UI kit, load-test notes, app code READMEs, agent instruction files (Z-48).
[modules/17-ui-system/AssessIQ_UI_Template/**]
BasedOnStyles =
[tests/**]
BasedOnStyles =
[apps/**]
BasedOnStyles =
[modules/11-candidate-ui/**]
BasedOnStyles =
[CLAUDE.md]
BasedOnStyles =
[PROJECT_BRAIN.md]
BasedOnStyles =
