name: Docs lint

# ADVISORY until 2026-10-29, then REQUIRED (RW-85, see docs/STYLE.md).
# On 2026-10-29: set fail_on_error to true on the Vale step and remove
# continue-on-error from the markdownlint step. tools/lint-docs.mjs
# turns strict by itself from that date.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'modules/16-help-system/content/**'
      - 'modules/13-notifications/src/email/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'modules/16-help-system/content/**'
      - 'modules/13-notifications/src/email/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Vale
        uses: errata-ai/vale-action@v2
        with:
          # CI reports errors only: 60000 suggestion/warning findings made reviewdog stop with "Too many results" (Z-48).
          vale_flags: '--config=.vale.ini --minAlertLevel=error'
          files: '["README.md"]' # JSON array: a comma string is read as ONE path and Vale scanned the whole repo (Z-48)
          # github-check posts through the Checks API. The default pr-check reporter
          # hit an 'Unhandled error event' socket error in reviewdog (Z-48) and failed the job
          # even when Vale found no error. nofilter keeps push runs working.
          reporter: github-check
          filter_mode: nofilter
          level: warning
          fail_on_error: false # flip to true on 2026-10-29
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        continue-on-error: true # remove on 2026-10-29
        with:
          globs: |
            docs/**/*.md
            README.md
      - name: Docs checks
        run: node tools/lint-docs.mjs
